name: Build JCG Q3000 (Pure Edition)

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 拉取你自己的仓库源码
      uses: actions/checkout@v4

    - name: 2. 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"

    - name: 3. 更新并安装插件源 (Feeds)
      run: |
        # 🔑 先清理底包自带的同名源，绝对防止 Duplicate 冲突！
        sed -i '/istore/d' feeds.conf.default
        sed -i '/openclash/d' feeds.conf.default
        
        # 注入最新的 iStore 软件源与 OpenClash 官方源
        echo "src-git istore https://github.com/linkease/istore;main" >> feeds.conf.default
        echo "src-git openclash https://github.com/vernesong/OpenClash.git;master" >> feeds.conf.default
        
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 4. 生成极简版 Q3000 专属配置
      run: |
        # 绝对遵从你仓库中 H大佬的默认底包配置
        cp -f defconfig/mt7981-ax3000.config .config
        echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_ikuai_q3000=y" >> .config
        
        # 🎯 仅额外注入你要求的两个核心插件
        echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y" >> .config
        
        make defconfig

    - name: 5. 下载所需依赖包
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 6. 🚀 开始火力全开编译固件 (约需 40-60 分钟)
      run: |
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: 7. 📦 提取并打包编译好的固件
      id: organize
      run: |
        cd bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 8. 上传固件到 GitHub 供下载
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: Q3000_Pure_iStore_OpenClash
        path: ${{ env.FIRMWARE }}
