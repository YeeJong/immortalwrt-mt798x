name: 自动编译 Q3000 固件

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 1. 拉取完美源码
      uses: actions/checkout@v4

    - name: 2. 清理云端服务器空间 (防止硬盘塞满)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: 3. 安装编译所需的运行环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo apt -y autoremove --purge
        sudo apt clean

    - name: 4. 下载并更新插件包 (Feeds)
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 5. 生成 Q3000 专属配置文件
      run: |
        cp -f defconfig/mt7981-ax3000.config .config
        echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_ikuai_q3000=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
      echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
      echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> .config
      echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        make defconfig

    - name: 6. 下载所需依赖包
      run: |
        make download -j8

    - name: 7. 🚀 开始火力全开编译固件 (约需 40-60 分钟)
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: 8. 📦 提取并打包编译好的固件
      uses: actions/upload-artifact@v4
      with:
        name: Q3000-Firmware
        path: bin/targets/mediatek/mt7981/*sysupgrade.bin
