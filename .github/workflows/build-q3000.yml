name: 自动编译 Q3000 固件

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: 1. 拉取完美源码
      uses: actions/checkout@v4

    - name: 2. 清理云端服务器空间 (防止硬盘塞满)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - name: 3. 安装编译所需的运行环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget
        sudo apt -y autoremove --purge
        sudo apt clean

    - name: 4. 下载并更新插件包 (Feeds)
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 5. 生成 Q3000 专属配置 (接入官方源完美纯血版)
      run: |
        # 🔑 先清理自带的同名源，防止 Duplicate 冲突！
        sed -i '/istore/d' feeds.conf.default
        sed -i '/openclash/d' feeds.conf.default
        
        # 重新注入绝对纯正的官方源
        echo "src-git istore https://github.com/linkease/istore;main" >> feeds.conf.default
        ./scripts/feeds update istore
        ./scripts/feeds install -a -p istore
        
        echo "src-git openclash https://github.com/vernesong/OpenClash.git;master" >> feeds.conf.default
        ./scripts/feeds update openclash
        ./scripts/feeds install -a -p openclash

        cp -f defconfig/mt7981-ax3000.config .config
        
        # 1. 基础设备与主题
        echo "CONFIG_TARGET_mediatek_mt7981_DEVICE_ikuai_q3000=y" >> .config
        echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-argon-config=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-turboacc=y" >> .config
        
        # 2. 从官方源原生编译 iStore 和 iStoreX（这次绝对带纯正中文包）
        echo "CONFIG_PACKAGE_luci-app-store=y" >> .config
        echo "CONFIG_PACKAGE_luci-app-istorex=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-istorex-zh-cn=y" >> .config
        
        # 3. 编译 OpenClash (小猫咪)
        echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y" >> .config
        
        # 4. iStoreX 运行所需要的底层驱动
        echo "CONFIG_PACKAGE_kmod-md-mod=y" >> .config
        echo "CONFIG_PACKAGE_kmod-md-raid0=y" >> .config
        echo "CONFIG_PACKAGE_kmod-md-raid1=y" >> .config
        echo "CONFIG_PACKAGE_kmod-md-raid10=y" >> .config
        echo "CONFIG_PACKAGE_mdadm=y" >> .config
        
        # 5. 全局中文总开关
        echo "CONFIG_LUCI_LANG_zh_cn=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-base-zh-cn=y" >> .config
        
        # 6. 替换默认主题为 Argon
        sed -i 's/luci-theme-bootstrap/luci-theme-argon/g' feeds/luci/collections/luci/Makefile
        
        # 7. 首次启动自动执行脚本：卸载简易向导并锁定大门
        mkdir -p files/etc/uci-defaults
        cat << "EOF" > files/etc/uci-defaults/99-set-istorex-default
        #!/bin/sh
        # 彻底干掉蓝色的简易小白向导
        opkg remove luci-app-quickstart --force-depends || true
        # 强制将默认大门修改为 iStoreX
        sed -i 's/cgi-bin\/luci/cgi-bin\/luci\/admin\/istorex/g' /www/index.html
        # 在底层强制锁定中文
        uci set luci.main.lang=zh_cn
        uci commit luci
        exit 0
        EOF
        chmod +x files/etc/uci-defaults/99-set-istorex-default
        
        make defconfig
        
    - name: 6. 下载所需依赖包
      run: |
        make download -j8

    - name: 7. 🚀 开始火力全开编译固件 (约需 40-60 分钟)
      run: |
        make -j$(nproc) || make -j1 V=s

    - name: 8. 📦 提取并打包编译好的固件
      uses: actions/upload-artifact@v4
      with:
        name: IK-Q3000-iStoreOS-DIY
        path: bin/targets/mediatek/mt7981/*.bin
